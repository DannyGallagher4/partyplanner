<!DOCTYPE html>
<html>
<head>
  <title>Mapbox Flask Example</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href='https://api.mapbox.com/mapbox-gl-js/v2.6.1/mapbox-gl.css' rel='stylesheet' />
  <style>
    body { margin: 0; padding: 0; }
    #map {
        position: absolute;
        top: 50px;
        width: 100%;
        height: calc(100% - 50px);
    }
    #placeInput { margin: 10px; }
  </style>
</head>
<body>

<input type="text" id="placeInput" placeholder="Enter a place name">
<button onclick="showPlace()">Show on Map</button>
<div id='map'></div>

<script src='https://api.mapbox.com/mapbox-gl-js/v2.6.1/mapbox-gl.js'></script>
<script>
  mapboxgl.accessToken = '{{ mapbox_access_token }}';

  var map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/streets-v11',
    center: [-74.5, 40],
    zoom: 9
  });

  function showPlace() {
    var placeInput = document.getElementById('placeInput').value;
    var encodedPlace = encodeURIComponent(placeInput)

    fetch('/get_coordinates', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'place_name=' + encodedPlace
    })
    .then(response => response.json())
    .then(data => {
      if ('error' in data) {
        alert(data.error);
      } else {
        map.flyTo({ center: [data.lng, data.lat], zoom: 14 });
        var popup = new mapboxgl.Popup()
            .setHTML('<h3>'+data.name+'</h3>');

        var coordinates = [data.lng, data.lat]
        
        new mapboxgl.Marker()
            .setLngLat(coordinates)
            .setPopup(popup)
            .addTo(map);

        popup.addTo(map)
      }
    })
    .catch(error => console.error('Error:', error));
  }
</script>

</body>
</html>
