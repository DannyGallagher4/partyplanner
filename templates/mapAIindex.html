<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Party Planner</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            text-align: center;
        }

        #main-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            max-width: 800px;
        }

        form {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 400px;
            margin-right: 20px;
        }

        #map-container {
            flex: 1;
            max-height: 60vh; /* Set a maximum height */
            overflow-y: auto; /* Enable vertical scrolling if content overflows */
            position: relative;
        }

        .response-text {
            white-space: pre-line;
        }
    </style>
</head>
<body>
    
    <h1 id = "topthing">Party Planner</h1>

    <div id = "main-container">

        <form method="post" action="/">
            <label for="prompt"> Input --> </label>
            <input type="text" id="prompt" name="prompt" placeholder="Type your prompt...">

            <br>

            <input type="submit" value="Submit" onclick="callAI()">
        </form>

        <div id="map-container">
            <!-- Mapbox map goes here -->
        </div>
    </div>


    {% if history %}
    <div>
        <h2>Log</h2>
        {% for item in history %}
        <div class="history-item">
            <h3>Input:</h3>
            <p class="response-text">{{ item[0] }}</p> <!-- Display previous input -->
            <h3>Response:</h3>
            <p class="response-text">{{ item[1] }}</p> <!-- Display previous response -->
        </div>
        {% endfor %}
    </div>
    {% endif %}
